<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="발판을 밟고 통통 튀어 하늘 높이 올라가는 네온 점프 게임">
  <title>통통 점프</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm12.5-1.9a1 1 0 0 1 1.4 0 7 7 0 0 1 0 9.8 1 1 0 1 1-1.4-1.4 5 5 0 0 0 0-7 1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm11.3.3a1 1 0 0 1 1.4 0L18.5 11l1.8-1.7a1 1 0 1 1 1.4 1.4L19.9 12.5l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 4V1.5a.5.5 0 0 0-.8-.4L6.6 4.6a.5.5 0 0 0 0 .8l4.6 3.5a.5.5 0 0 0 .8-.4V6a6 6 0 1 1-6 6 1 1 0 1 0-2 0 8 8 0 1 0 8-8z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15v3h3v3H8v-3h3v-3a5 5 0 0 1-3.7-3H7a4 4 0 0 1-4-4V6a1 1 0 0 1 1-1h3zm10 4v3a2 2 0 0 0 2-2V7zM5 7v1a2 2 0 0 0 2 2V7z"/></symbol>
    <symbol id="i-lr" viewBox="0 0 24 24"><path d="M9 6 3 12l6 6v-4h2v-4H9zm6 0v4h-2v4h2v4l6-6z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></symbol>
    <symbol id="i-spring" viewBox="0 0 24 24"><path d="M4 19h16v3H4zM7 4h10v3H7zm1 5 8 2-8 2 8 2-1 2-9-2.2v-1.6L12 12 6 10.6V9z"/></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 1c3 2.4 4.5 6 4.3 10.6l2.7 3.4v4l-3.6-2.2H8.6L5 19v-4l2.7-3.4C7.5 7 9 3.4 12 1zm0 6.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM10 19h4l-2 4z"/></symbol>
    <symbol id="i-mine" viewBox="0 0 24 24"><path d="M12 1l1.6 4.1 4-1.9-1.4 4.2 4.3 1-3.4 2.8 3.4 2.8-4.3 1 1.4 4.2-4-1.9L12 23l-1.6-4.1-4 1.9 1.4-4.2-4.3-1 3.4-2.8-3.4-2.8 4.3-1-1.4-4.2 4 1.9z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 2 4 11h5v6h6v-6h5zM6 19h12v3H6z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3.2l.7 3H21a1 1 0 0 1 1 1.2l-1.4 7A2 2 0 0 1 18.6 16H8.4a2 2 0 0 1-2-1.6L4.4 5H2zm7 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3.2 2.5 11.3a1 1 0 0 0 1.3 1.5l.9-.8V20a1 1 0 0 0 1 1h4.3v-5.5h4v5.5h4.3a1 1 0 0 0 1-1v-8l.9.8a1 1 0 0 0 1.3-1.5z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7 2h4l1 4 1-4h4l-3 7.2A6 6 0 1 1 10 9.2zm5 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 1.6 1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></symbol>
  </svg>

  <div id="topbar">
    <button id="btn-pause" class="icon-btn" aria-label="일시정지"><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기"><svg class="i on" aria-hidden="true"><use href="#i-sound"/></svg><svg class="i off" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button id="btn-fs" class="icon-btn" aria-label="전체 화면"><svg class="i" aria-hidden="true"><use href="#i-fs"/></svg></button>
  </div>
  <div id="toast" role="status"></div>

  <!-- 시작 화면: 왼쪽 로고·내 캐릭터·미션 / 오른쪽 난이도·시작·상점·메달·도움말 -->
  <section id="scr-title" class="screen">
    <div class="panel tpanel">
      <span class="pf-badge" data-pf-badge hidden></span>
      <div class="t-left">
        <a id="btn-hub" class="home-btn" href="../index.html" aria-label="게임 고르기로"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg></a>
        <h1 class="logo ko">통통 <span>점프</span></h1>
        <p class="tagline">발판을 밟고 하늘 높이 올라가요</p>
        <p id="best" class="best"></p>
        <button id="btn-char" type="button" class="ship-card" aria-label="캐릭터 바꾸기">
          <canvas id="char-preview" class="ship-cv" width="128" height="128" aria-hidden="true"></canvas>
          <span class="sc-txt"><small>내 캐릭터</small><b id="char-name">통통 로봇</b><em id="char-desc"></em></span>
          <span class="sc-go">바꾸기</span>
        </button>
        <div id="title-missions" class="mcard"></div>
      </div>
      <div class="t-right">
        <div class="level-seg" role="group" aria-label="난이도">
          <button type="button" data-diff="easy" aria-pressed="true"><b>쉬움</b><small>구조 구름 3번<br>폭탄 없음</small></button>
          <button type="button" data-diff="normal" aria-pressed="false"><b>보통</b><small>가시 폭탄<br>떨어지면 끝</small></button>
          <button type="button" data-diff="hard" aria-pressed="false"><b>어려움</b><small>좁고 빠른 발판<br>폭탄 일찍</small></button>
        </div>
        <div id="start-pick" class="start-pick" hidden>
          <p class="sp-head">어디서 출발할까?</p>
          <div id="start-row" class="sp-row" role="group" aria-label="출발 장소"></div>
        </div>
        <p id="loadout-line" class="loadout-line"></p>
        <button id="btn-start" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>시작하기</span> <kbd class="only-pc">Enter</kbd></button>
        <div class="t-row">
          <button id="btn-shop" type="button" class="shop-btn"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg><span>상점</span><span class="coin-pill"><i class="cn" aria-hidden="true"></i><b id="coin-count">0</b></span></button>
          <button id="btn-medals" type="button" class="shop-btn"><svg class="i gold" aria-hidden="true"><use href="#i-medal"/></svg><span>메달·기록 <b id="medal-count">0/0</b></span></button>
        </div>
        <ul class="help">
          <li><svg class="i" aria-hidden="true"><use href="#i-lr"/></svg><span><b class="only-touch">왼쪽·오른쪽을 누르거나 손가락으로 밀어요</b><b class="only-pc">← → 방향키로 움직여요</b></span></li>
          <li><svg class="i gold" aria-hidden="true"><use href="#i-star"/></svg><span><b>별·스프링·로켓</b>은 좋아요 · <b class="danger">빨간 가시</b>는 피해요</span></li>
          <li><svg class="i violet" aria-hidden="true"><use href="#i-up"/></svg><span><b>높이높이</b> 구름 위, 우주, 외계 행성까지!</span></li>
        </ul>
        <p class="pc-line only-pc">PC: <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</p>
      </div>
    </div>
  </section>

  <!-- 상점 -->
  <section id="scr-shop" class="screen">
    <div class="panel wide spanel">
      <div class="shop-head">
        <h2>상점</h2>
        <span class="coin-pill big"><i class="cn" aria-hidden="true"></i><b id="shop-coins">0</b></span>
      </div>
      <div class="tabs" role="tablist" aria-label="상점 칸">
        <button type="button" role="tab" data-tab="chars" aria-selected="true">캐릭터</button>
        <button type="button" role="tab" data-tab="up" aria-selected="false">강화</button>
        <button type="button" role="tab" data-tab="items" aria-selected="false">시작 아이템</button>
      </div>
      <p id="shop-sub" class="sub shop-sub"></p>
      <div id="shop-list" class="shop-list"></div>
      <button id="btn-shop-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 메달 · 기록 -->
  <section id="scr-medals" class="screen">
    <div class="panel wide">
      <h2>메달 · 기록</h2>
      <p class="sub" id="medal-sub"></p>
      <div id="medal-list"></div>
      <dl id="record-list" class="records"></dl>
      <button id="btn-medals-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="scr-pause" class="screen">
    <div class="panel">
      <h2>일시정지</h2>
      <p class="sub">숨 고르고 다시 튀어 올라요</p>
      <button id="btn-resume" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>계속하기</span></button>
      <button id="btn-quit" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <!-- 한 번 더! (한 판에 한 번, 공짜): 큰 버튼 + 5초 고리, 작은 "그만하기" -->
  <section id="scr-cont" class="screen">
    <div class="panel cpanel">
      <p class="sub cont-sub">구름이 받아 줄게요 · 지금 <b id="cont-height">0m</b></p>
      <button id="btn-cont" type="button" class="cont-btn" aria-label="한 번 더">
        <svg class="cont-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54"/><circle id="cont-ring" class="fg" cx="60" cy="60" r="54" pathLength="100"/></svg>
        <span class="cont-txt">한 번 더!</span>
        <span id="cont-num" class="cont-num">5</span>
      </button>
      <button id="btn-cont-no" type="button" class="text-btn">그만하기</button>
    </div>
  </section>

  <!-- 게임 오버: 왼쪽 점수·기록 / 오른쪽 코인·미션·메달·버튼 -->
  <section id="scr-over" class="screen">
    <div class="panel opanel">
      <div class="o-left">
        <h2 id="over-title">잘했어요!</h2>
        <p id="over-sub" class="sub over-sub"></p>
        <p class="over-diff">난이도 <b id="over-diff">쉬움</b> · <b id="over-zone">하늘 구역</b></p>
        <p class="score-big"><span id="over-score">0</span><small>점</small></p>
        <p id="over-new" class="new-best"><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg><span id="over-new-txt">최고 점수 경신</span></p>
        <dl class="stats">
          <div><dt>높이</dt><dd id="over-height">0m</dd></div>
          <div><dt>별</dt><dd id="over-stars">0</dd></div>
          <div><dt>최고 콤보</dt><dd id="over-combo">0</dd></div>
          <div><dt>시간</dt><dd id="over-time">0:00</dd></div>
        </dl>
        <div id="over-records" class="chips"></div>
      </div>
      <div class="o-right">
        <div class="coin-earn">
          <span class="ce-head"><i class="cn" aria-hidden="true"></i>얻은 코인</span>
          <b id="over-coins">+0</b>
          <span id="over-coin-parts" class="ce-parts"></span>
        </div>
        <div id="over-missions" class="mcard"></div>
        <div id="over-medals" class="new-medals"></div>
        <button id="btn-retry" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg><span>다시 하기</span> <kbd class="only-pc">Enter</kbd></button>
        <div class="o-links">
          <button id="btn-home" class="text-btn">처음 화면으로</button>
          <a id="btn-over-hub" class="home-btn inline" href="../index.html" aria-label="게임 고르기로"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>게임 고르기</span></a>
        </div>
      </div>
    </div>
  </section>

  <script src="../common/profile.js"></script>
  <script src="../common/hub.js"></script>
  <script src="../common/worlds.js"></script>
  <script src="../common/sound.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/records.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/space.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
