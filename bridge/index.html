<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="손가락으로 그린 선이 진짜 다리가 되는 우주 퍼즐">
  <title>슥슥 우주 다리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm12.5-1.9a1 1 0 0 1 1.4 0 7 7 0 0 1 0 9.8 1 1 0 1 1-1.4-1.4 5 5 0 0 0 0-7 1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm11.3.3a1 1 0 0 1 1.4 0L18.5 11l1.8-1.7a1 1 0 1 1 1.4 1.4L19.9 12.5l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 4V1.5a.5.5 0 0 0-.8-.4L6.6 4.6a.5.5 0 0 0 0 .8l4.6 3.5a.5.5 0 0 0 .8-.4V6a6 6 0 1 1-6 6 1 1 0 1 0-2 0 8 8 0 1 0 8-8z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5.5V3a.5.5 0 0 0-.85-.35L3.6 7.15a.5.5 0 0 0 0 .7l4.55 4.5A.5.5 0 0 0 9 12V9.5h5.5a4.5 4.5 0 0 1 0 9H8a1 1 0 0 0 0 2h6.5a6.5 6.5 0 0 0 0-13H9z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16.9 2.6a2 2 0 0 1 2.8 0l1.7 1.7a2 2 0 0 1 0 2.8L9.2 19.3 4 20.5a.5.5 0 0 1-.6-.6l1.2-5.2zM6.3 15.6l-.8 3.1 3.1-.8z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3l2.2 11.2A2 2 0 0 0 9.2 16H18a2 2 0 0 0 2-1.6L21.6 7H6.2M9 21a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24"><path d="M12 3.2 2.6 11a1 1 0 0 0 1.3 1.5L5 11.6V20a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1v-8.4l1.1.9a1 1 0 0 0 1.3-1.5z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7 2h4l1 4 1-4h4l-3 7.2A6 6 0 1 1 10 9.2zm5 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 1.6 1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 4 12.7V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.3A7 7 0 0 1 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></symbol>
  </svg>

  <!-- 위쪽 버튼 (시작 화면·판 고르기·상점) -->
  <div id="topbar">
    <a id="btn-hub" class="icon-btn" href="../index.html" aria-label="게임 고르기로 가기"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg></a>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기"><svg class="i on" aria-hidden="true"><use href="#i-sound"/></svg><svg class="i off" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button id="btn-fs" class="icon-btn" aria-label="전체 화면"><svg class="i" aria-hidden="true"><use href="#i-fs"/></svg></button>
  </div>
  <div id="toast" role="status"></div>

  <!-- 게임 중 버튼 줄: 판 고르기 · 판 이름 · 잉크 · 되돌리기 · 다시 · 힌트 -->
  <div id="hud" aria-label="게임 버튼">
    <div class="hud-l">
      <button id="btn-back" class="round-btn" aria-label="판 고르기로"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
      <span id="hud-level" class="chip"><i class="pdot" aria-hidden="true"></i><b>달 1판</b></span>
    </div>
    <div id="ink" class="ink" role="meter" aria-label="잉크">
      <svg class="i" aria-hidden="true"><use href="#i-pen"/></svg>
      <span class="ink-bar"><i id="ink-fill"></i><em id="ink-s3" class="ink-star" aria-hidden="true"></em><em id="ink-s2" class="ink-star" aria-hidden="true"></em></span>
    </div>
    <div class="hud-r">
      <button id="btn-undo" class="round-btn" aria-label="마지막 선 지우기"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button id="btn-reset" class="round-btn" aria-label="처음부터 다시"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg></button>
      <button id="btn-hint" class="round-btn hint" aria-label="힌트 보기"><svg class="i" aria-hidden="true"><use href="#i-hint"/></svg></button>
    </div>
  </div>
  <p id="tip" class="tip" aria-live="polite"></p>

  <!-- 시작 화면: 왼쪽 로고·내 캐릭터·미션 / 오른쪽 행성·이어서·상점·메달 -->
  <section id="scr-title" class="screen">
    <div class="panel tpanel">
      <span class="pf-badge" data-pf-badge hidden></span>
      <div class="t-left">
        <h1 class="logo ko">슥슥 <span class="space">우주 </span><span class="hl">다리</span></h1>
        <p class="tagline">그린 선이 진짜가 돼요!</p>
        <p id="best" class="best"></p>
        <button id="btn-char" type="button" class="ship-card" aria-label="캐릭터 바꾸기">
          <canvas id="char-preview" class="ship-cv" width="128" height="128" aria-hidden="true"></canvas>
          <span class="sc-txt"><small>내 캐릭터</small><b id="char-name">데굴이</b><em id="char-desc"></em></span>
          <span class="sc-go">바꾸기</span>
        </button>
        <div id="title-missions" class="mcard"></div>
      </div>
      <div class="t-right">
        <div id="planets" class="planets"></div>
        <button id="btn-start" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span id="start-label">출발!</span></button>
        <div class="t-row">
          <button id="btn-shop" type="button" class="shop-btn"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg><span>상점</span><span class="coin-pill"><i class="cn" aria-hidden="true"></i><b id="coin-count">0</b></span></button>
          <button id="btn-medals" class="mini-btn"><svg class="i" aria-hidden="true"><use href="#i-medal"/></svg><span>메달·기록 <b id="medal-count">0/0</b></span></button>
        </div>
        <ul class="help">
          <li><svg class="i" aria-hidden="true"><use href="#i-pen"/></svg><span><b>손가락으로 쭉</b> 그리면 진짜 다리가 돼요</span></li>
          <li><svg class="i gold" aria-hidden="true"><use href="#i-star"/></svg><span>공을 <b>외계인 친구</b>에게 데려다줘요</span></li>
          <li><svg class="i pink" aria-hidden="true"><use href="#i-undo"/></svg><span><b>톡</b> 누르면 구슬 · 잉크를 아끼면 별이 많아요</span></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- 판 고르기 -->
  <section id="scr-levels" class="screen">
    <div class="panel wide lpanel">
      <h2 id="lv-title">달</h2>
      <p id="lv-sub" class="sub"></p>
      <div id="lv-grid" class="lv-grid"></div>
      <button id="btn-lv-back" class="mini-btn wide-mini"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg><span>처음 화면으로</span></button>
    </div>
  </section>

  <!-- 만났다! (판을 깼을 때) -->
  <section id="scr-clear" class="screen">
    <div class="panel cpanel">
      <div class="c-left">
        <h2 id="clear-title">만났다!</h2>
        <div id="clear-stars" class="big-stars" aria-label="별"><i></i><i></i><i></i></div>
        <p id="clear-line" class="clear-line"></p>
        <div class="coin-earn">
          <span class="ce-head"><i class="cn" aria-hidden="true"></i>얻은 코인</span>
          <b id="clear-coins">+0</b>
          <span id="clear-parts" class="ce-parts"></span>
        </div>
        <div id="clear-medals" class="new-medals"></div>
      </div>
      <div class="c-right">
        <div id="clear-missions" class="mcard"></div>
        <div class="c-btns">
          <button id="btn-again" class="mini-btn"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg><span>다시</span></button>
          <button id="btn-next" class="big-btn"><span>다음 판</span><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
        </div>
        <button id="btn-clear-levels" class="mini-btn wide-mini"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg><span>판 고르기</span></button>
      </div>
    </div>
  </section>

  <!-- 상점 -->
  <section id="scr-shop" class="screen">
    <div class="panel wide spanel">
      <div class="shop-head">
        <h2>상점</h2>
        <span class="coin-pill big"><i class="cn" aria-hidden="true"></i><b id="shop-coins">0</b></span>
      </div>
      <div class="tabs" role="tablist" aria-label="상점 칸">
        <button type="button" role="tab" data-tab="chars" aria-selected="true">캐릭터</button>
        <button type="button" role="tab" data-tab="pens" aria-selected="false">펜 색깔</button>
      </div>
      <p id="shop-sub" class="sub shop-sub"></p>
      <div id="shop-list" class="shop-list"></div>
      <button id="btn-shop-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 메달 · 기록 -->
  <section id="scr-medals" class="screen">
    <div class="panel wide">
      <h2>메달 · 기록</h2>
      <p class="sub" id="medal-sub"></p>
      <div id="medal-list"></div>
      <dl id="record-list" class="records"></dl>
      <button id="btn-medals-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <script src="../common/profile.js"></script>
  <script src="../common/hub.js"></script>
  <script src="../common/worlds.js"></script>
  <script src="../common/sound.js"></script>
  <script src="lib/planck.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
