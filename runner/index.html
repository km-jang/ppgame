<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="별을 모으며 네온 우주 길을 달리는 게임">
  <title>슝슝 우주 달리기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm12.5-1.9a1 1 0 0 1 1.4 0 7 7 0 0 1 0 9.8 1 1 0 1 1-1.4-1.4 5 5 0 0 0 0-7 1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm11.3.3a1 1 0 0 1 1.4 0L18.5 11l1.8-1.7a1 1 0 1 1 1.4 1.4L19.9 12.5l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 4V1.5a.5.5 0 0 0-.8-.4L6.6 4.6a.5.5 0 0 0 0 .8l4.6 3.5a.5.5 0 0 0 .8-.4V6a6 6 0 1 1-6 6 1 1 0 1 0-2 0 8 8 0 1 0 8-8z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15v3h3v3H8v-3h3v-3a5 5 0 0 1-3.7-3H7a4 4 0 0 1-4-4V6a1 1 0 0 1 1-1h3zm10 4v3a2 2 0 0 0 2-2V7zM5 7v1a2 2 0 0 0 2 2V7z"/></symbol>
    <symbol id="i-lr" viewBox="0 0 24 24"><path d="M2 12l5-5v3h10V7l5 5-5 5v-3H7v3z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 2l7 7h-4v6H9V9H5zM5 18h14v3H5z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 3h14v3H5zM9 8h6v6h4l-7 7-7-7h4z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></symbol>
    <symbol id="i-rock" viewBox="0 0 24 24"><path d="M8 3l7 1 5 5 1 6-4 5-8 1-5-4-1-7zm1 5l-2 3 2 2m6-6l1 3-2 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M4 3h5v9a3 3 0 0 0 6 0V3h5v9a8 8 0 0 1-16 0zm0 2v3h5V5zm11 0v3h5V5z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M14 1L4 14h7l-2 9 11-13h-7z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3l2.2 11.2A2 2 0 0 0 9.2 16H18a2 2 0 0 0 2-1.6L21.6 7H6.2M9 21a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24"><path d="M12 3.2 2.6 11a1 1 0 0 0 1.3 1.5L5 11.6V20a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1v-8.4l1.1.9a1 1 0 0 0 1.3-1.5z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7 2h4l1 4 1-4h4l-3 7.2A6 6 0 1 1 10 9.2zm5 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 1.6 1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></symbol>
  </svg>

  <div id="topbar">
    <a id="btn-hub" class="icon-btn" href="../index.html" aria-label="게임 고르기로 가기"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg></a>
    <button id="btn-pause" class="icon-btn" aria-label="일시정지"><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기"><svg class="i on" aria-hidden="true"><use href="#i-sound"/></svg><svg class="i off" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button id="btn-fs" class="icon-btn" aria-label="전체 화면"><svg class="i" aria-hidden="true"><use href="#i-fs"/></svg></button>
  </div>
  <div id="toast" role="status"></div>

  <!-- 시작 화면: 왼쪽 로고·내 캐릭터·미션 / 오른쪽 난이도·출발·상점·메달·도움말 -->
  <section id="scr-title" class="screen">
    <div class="panel tpanel">
      <span class="pf-badge" data-pf-badge hidden></span>
      <div class="t-left">
        <h1 class="logo ko">슝슝 <span class="space">우주 </span><span class="hl">달리기</span></h1>
        <p class="tagline">별을 모으며 우주 길을 달려요</p>
        <p id="best" class="best"></p>
        <button id="btn-ship" type="button" class="ship-card" aria-label="캐릭터 바꾸기">
          <canvas id="ship-preview" class="ship-cv" width="128" height="128" aria-hidden="true"></canvas>
          <span class="sc-txt"><small>내 캐릭터</small><b id="ship-name">슝슝 제트</b><em id="ship-desc"></em></span>
          <span class="sc-go">바꾸기</span>
        </button>
        <div id="title-missions" class="mcard"></div>
      </div>
      <div class="t-right">
        <div class="level-seg" role="group" aria-label="난이도">
          <button type="button" data-diff="easy" aria-pressed="true"><b>쉬움</b><small>천천히 · 하트 3</small></button>
          <button type="button" data-diff="normal" aria-pressed="false"><b>보통</b><small>빠르게 · 하트 2</small></button>
          <button type="button" data-diff="hard" aria-pressed="false"><b>어려움</b><small>쌩쌩 · 하트 1</small></button>
        </div>
        <p id="loadout-line" class="loadout-line"></p>
        <button id="btn-start" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>출발!</span> <kbd class="only-pc">Enter</kbd></button>
        <div class="t-row">
          <button id="btn-shop" type="button" class="shop-btn"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg><span>상점</span><span class="coin-pill"><i class="cn" aria-hidden="true"></i><b id="coin-count">0</b></span></button>
          <button id="btn-medals" class="mini-btn"><svg class="i" aria-hidden="true"><use href="#i-medal"/></svg><span>메달·기록 <b id="medal-count">0/0</b></span></button>
        </div>
        <ul class="help">
          <li><svg class="i" aria-hidden="true"><use href="#i-lr"/></svg><span><b class="only-touch">옆으로 밀기</b><b class="only-pc">← →</b> 줄 바꾸기 · <b class="danger">빨간 운석</b>은 피해요</span></li>
          <li><svg class="i" aria-hidden="true"><use href="#i-up"/></svg><span><b class="only-touch">위로 밀기</b><b class="only-pc">↑</b> 점프 · <b class="only-touch">아래로 밀기</b><b class="only-pc">↓</b> 미끄러지기</span></li>
          <li><svg class="i gold" aria-hidden="true"><use href="#i-star"/></svg><span><b>별</b>과 반짝이는 구슬은 모두 좋은 것</span></li>
        </ul>
        <p class="pc-line only-pc">PC: <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</p>
      </div>
    </div>
  </section>

  <!-- 상점 -->
  <section id="scr-shop" class="screen">
    <div class="panel wide spanel">
      <div class="shop-head">
        <h2>상점</h2>
        <span class="coin-pill big"><i class="cn" aria-hidden="true"></i><b id="shop-coins">0</b></span>
      </div>
      <div class="tabs" role="tablist" aria-label="상점 칸">
        <button type="button" role="tab" data-tab="chars" aria-selected="true">캐릭터</button>
        <button type="button" role="tab" data-tab="up" aria-selected="false">강화</button>
        <button type="button" role="tab" data-tab="items" aria-selected="false">시작 아이템</button>
      </div>
      <p id="shop-sub" class="sub shop-sub"></p>
      <div id="shop-list" class="shop-list"></div>
      <button id="btn-shop-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 메달 · 기록 -->
  <section id="scr-medals" class="screen">
    <div class="panel wide">
      <h2>메달 · 기록</h2>
      <p class="sub" id="medal-sub"></p>
      <div id="medal-list"></div>
      <dl id="record-list" class="records"></dl>
      <button id="btn-medals-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="scr-pause" class="screen">
    <div class="panel">
      <h2>일시정지</h2>
      <p class="sub">숨 고르고 다시 날아요</p>
      <button id="btn-resume" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>계속하기</span></button>
      <button id="btn-quit" class="mini-btn wide-mini"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg><span>처음 화면으로</span></button>
    </div>
  </section>

  <!-- 한 번 더? (하트가 다했을 때 한 판에 한 번, 돈 0원): 큰 버튼 둘레에 줄어드는 시계, 작은 "그만하기" -->
  <section id="scr-cont" class="screen">
    <div class="panel cpanel">
      <h2 id="cont-title">운석에 쾅!</h2>
      <button id="btn-cont" class="cont-btn" aria-label="한 번 더 하기">
        <svg class="cont-clock" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle id="cont-ring" class="ring" cx="50" cy="50" r="46"/></svg>
        <span class="cont-in"><b>한 번 더!</b><small>이 자리에서 이어 달려요</small><em id="cont-num">5</em></span>
      </button>
      <button id="btn-cont-no" class="text-btn cont-no">그만하기</button>
    </div>
  </section>

  <!-- 게임 오버: 왼쪽 점수·기록 / 오른쪽 코인·미션·메달·버튼 -->
  <section id="scr-over" class="screen">
    <div class="panel opanel">
      <div class="o-left">
        <h2 id="over-title">운석에 쾅!</h2>
        <p class="score-big"><span id="over-score">0</span><small>점</small></p>
        <p id="over-new" class="new-best"><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg> 최고 점수 경신</p>
        <dl class="stats">
          <div><dt>거리</dt><dd id="over-dist">0m</dd></div>
          <div><dt>별</dt><dd id="over-stars">0</dd></div>
          <div><dt>시간</dt><dd id="over-time">0:00</dd></div>
        </dl>
        <p id="over-diff" class="over-diff"></p>
        <div id="over-records" class="chips"></div>
      </div>
      <div class="o-right">
        <div class="coin-earn">
          <span class="ce-head"><i class="cn" aria-hidden="true"></i>얻은 코인</span>
          <b id="over-coins">+0</b>
          <span id="over-coin-parts" class="ce-parts"></span>
        </div>
        <div id="over-missions" class="mcard"></div>
        <div id="over-medals" class="new-medals"></div>
        <button id="btn-retry" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg><span>다시 하기</span> <kbd class="only-pc">Enter</kbd></button>
        <div class="o-btns">
          <button id="btn-home" class="mini-btn"><span>처음 화면으로</span></button>
          <a id="btn-over-hub" class="mini-btn" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg><span>게임 고르기</span></a>
        </div>
      </div>
    </div>
  </section>

  <script src="../common/profile.js"></script>
  <script src="../common/hub.js"></script>
  <script src="../common/worlds.js"></script>
  <script src="../common/sound.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
