<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="에너지 구슬을 먹을수록 길어지는 네온 뱀 게임">
  <title>냠냠 뱀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm12.5-1.9a1 1 0 0 1 1.4 0 7 7 0 0 1 0 9.8 1 1 0 1 1-1.4-1.4 5 5 0 0 0 0-7 1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm11.3.3a1 1 0 0 1 1.4 0L18.5 11l1.8-1.7a1 1 0 1 1 1.4 1.4L19.9 12.5l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 4V1.5a.5.5 0 0 0-.8-.4L6.6 4.6a.5.5 0 0 0 0 .8l4.6 3.5a.5.5 0 0 0 .8-.4V6a6 6 0 1 1-6 6 1 1 0 1 0-2 0 8 8 0 1 0 8-8z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15v3h3v3H8v-3h3v-3a5 5 0 0 1-3.7-3H7a4 4 0 0 1-4-4V6a1 1 0 0 1 1-1h3zm10 4v3a2 2 0 0 0 2-2V7zM5 7v1a2 2 0 0 0 2 2V7z"/></symbol>
    <symbol id="i-swipe" viewBox="0 0 24 24"><path d="M12 2l3 3h-2v4h-2V5H9zm0 20l-3-3h2v-4h2v4h2zM2 12l3-3v2h4v2H5v2zm20 0l-3 3v-2h-4v-2h4V9z"/></symbol>
    <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></symbol>
    <symbol id="i-wall" viewBox="0 0 24 24"><path d="M3 5h18v4H3zm0 5h8v4H3zm9 0h9v4h-9zM3 15h18v4H3z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7 2h4l1 4 1-4h4l-3 7.2A6 6 0 1 1 10 9.2zm5 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 1.6 1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 2h2v20H5zm3 1h11l-2.5 4L19 11H8z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3.2l.7 3H21a1 1 0 0 1 1 1.2l-1.4 7A2 2 0 0 1 18.6 16H8.4a2 2 0 0 1-2-1.6L4.4 5H2zm7 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3.2 2.6 11a1 1 0 0 0 1.3 1.5l.9-.8V20a1 1 0 0 0 1 1h4.4v-5.5h3.6V21h4.4a1 1 0 0 0 1-1v-8.3l.9.8a1 1 0 0 0 1.3-1.5z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 3.5 20 1.5v13.2a3.3 3.3 0 1 1-2-3V6.1l-7 1.3v9.3a3.3 3.3 0 1 1-2-3z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></symbol>
  </svg>

  <div id="topbar">
    <button id="btn-hub" class="icon-btn" aria-label="게임 고르기로"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg></button>
    <button id="btn-pause" class="icon-btn" aria-label="일시정지"><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기"><svg class="i on" aria-hidden="true"><use href="#i-sound"/></svg><svg class="i off" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button id="btn-fs" class="icon-btn" aria-label="전체 화면"><svg class="i" aria-hidden="true"><use href="#i-fs"/></svg></button>
  </div>
  <div id="toast" role="status"></div>

  <!-- 시작 화면: 가로 화면은 두 칸 (왼쪽 로고·내 캐릭터·난이도·시작·상점 / 오른쪽 미션·도움말) -->
  <section id="scr-title" class="screen">
    <div class="panel tpanel">
      <div class="t-left">
        <h1 class="logo ko">냠냠 <span>뱀</span></h1>
        <p class="tagline">구슬을 먹으면 쭉쭉 길어져요</p>
        <p id="best" class="best"></p>
        <button id="btn-char" type="button" class="char-card" aria-label="캐릭터 바꾸기">
          <canvas id="char-preview" class="char-cv" width="168" height="76" aria-hidden="true"></canvas>
          <span class="cc-txt"><small>내 캐릭터</small><b id="char-name">네온 뱀</b><em id="char-trait"></em></span>
          <span class="cc-go">바꾸기</span>
        </button>
        <div class="level-seg three" role="group" aria-label="난이도">
          <button type="button" data-diff="easy" aria-pressed="true"><b>쉬움</b><small>느리게 · 벽 통과</small></button>
          <button type="button" data-diff="normal" aria-pressed="false"><b>보통</b><small>빠르게 · 벽 조심</small></button>
          <button type="button" data-diff="hard" aria-pressed="false" class="hard"><b>어려움</b><small>더 빠르게</small></button>
        </div>
        <button id="btn-rival" type="button" class="rival-tog" aria-pressed="true" aria-label="라이벌 뱀 켜기 끄기">
          <span class="rv-face" aria-hidden="true"><i></i><i></i></span>
          <span class="rv-txt"><b>라이벌 뱀</b><small>그냥 놀기에서 구슬 먹기 시합</small></span>
          <span class="rv-sw" aria-hidden="true"><i></i><em id="rival-state">켬</em></span>
        </button>
        <div class="modes">
          <button id="btn-start" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>그냥 놀기</span> <kbd class="only-pc">Enter</kbd></button>
          <button id="btn-stage" class="big-btn pink"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg><span>스테이지</span> <b id="stage-tag" class="tag"></b></button>
        </div>
        <p id="loadout-line" class="loadout-line"></p>
        <div class="t-row">
          <button id="btn-shop" type="button" class="shop-btn"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg><span>상점</span><span class="coin-pill"><i class="cn" aria-hidden="true"></i><b id="coin-count">0</b></span></button>
          <button id="btn-medals" class="mini-btn"><svg class="i" aria-hidden="true"><use href="#i-medal"/></svg><span>메달·기록 <b id="medal-count">0/0</b></span></button>
        </div>
      </div>
      <div class="t-right">
        <div id="title-missions" class="mcard"></div>
        <!-- 도움말은 짧게 세 줄 (아이가 읽기 쉽게) -->
        <ul class="help">
          <li><svg class="i" aria-hidden="true"><use href="#i-swipe"/></svg><span><b class="only-touch">화면을 밀어서</b><b class="only-pc">방향키로</b> 방향 바꾸기</span></li>
          <li><svg class="i gold" aria-hidden="true"><use href="#i-orb"/></svg><span><b>구슬</b> 냠냠, 쭉쭉 길어져요 · 아이템도 좋아요</span></li>
          <li><svg class="i red" aria-hidden="true"><use href="#i-wall"/></svg><span><b class="danger">빨간 벽·내 몸</b> 피해요 · <b class="rv">라이벌</b>은 물어도 돼요</span></li>
        </ul>
        <p class="pc-line only-pc">PC: <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</p>
      </div>
    </div>
  </section>

  <!-- 상점: 캐릭터 · 강화 · 시작 아이템 -->
  <section id="scr-shop" class="screen">
    <div class="panel wide spanel">
      <div class="shop-head">
        <h2>상점</h2>
        <span class="coin-pill big"><i class="cn" aria-hidden="true"></i><b id="shop-coins">0</b></span>
      </div>
      <div class="tabs" role="tablist" aria-label="상점 칸">
        <button type="button" role="tab" data-tab="chars" aria-selected="true">캐릭터</button>
        <button type="button" role="tab" data-tab="up" aria-selected="false">강화</button>
        <button type="button" role="tab" data-tab="items" aria-selected="false">시작 아이템</button>
      </div>
      <p id="shop-sub" class="sub shop-sub"></p>
      <div id="shop-list" class="shop-list"></div>
      <button id="btn-shop-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 스테이지 고르기 -->
  <section id="scr-stage" class="screen">
    <div class="panel wide">
      <div class="p-head">
        <h2>스테이지 <b id="stage-stars" class="star-pill">★ 0</b></h2>
        <button id="btn-stage-x" type="button" class="x-btn" aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <p class="sub">구슬을 다 먹으면 다음 단계! 빨리 깨면 별이 더 많아요</p>
      <div id="level-list"></div>
      <button id="btn-stage-back" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <!-- 메달 · 기록 -->
  <section id="scr-medals" class="screen">
    <div class="panel wide">
      <div class="p-head">
        <h2>메달 · 기록</h2>
        <button id="btn-medals-x" type="button" class="x-btn" aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <p class="sub" id="medal-sub"></p>
      <div id="medal-list"></div>
      <dl id="record-list" class="records"></dl>
      <button id="btn-medals-back" class="big-btn"><span>닫기</span></button>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="scr-pause" class="screen">
    <div class="panel">
      <h2>일시정지</h2>
      <p class="sub">숨 고르고 다시 달려요</p>
      <button id="btn-resume" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>계속하기</span></button>
      <button id="btn-music" type="button" class="music-tog" aria-pressed="true"><svg class="i" aria-hidden="true"><use href="#i-note"/></svg><span>음악 켬</span></button>
      <button id="btn-quit" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <!-- 한 번 더! (한 판에 한 번): 큰 단추 + 5초 고리, 작게 그만하기 -->
  <section id="scr-cont" class="screen">
    <div class="panel cpanel">
      <p class="c-head">앗! 한 번 더 할까요?</p>
      <button id="btn-cont" type="button" class="cont-btn">
        <svg id="cont-ring" class="c-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><circle class="c-go" cx="50" cy="50" r="46"/></svg>
        <span class="c-txt"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg>한 번 더!</span>
      </button>
      <button id="btn-giveup" type="button" class="text-btn">그만하기</button>
    </div>
  </section>

  <!-- 게임 오버: 가로 화면은 두 칸 (왼쪽 점수·기록 / 오른쪽 코인·미션·메달·버튼) -->
  <section id="scr-over" class="screen">
    <div class="panel opanel">
      <div class="o-left">
        <h2 id="over-title">앗, 쿵!</h2>
        <p class="score-big"><span id="over-score">0</span><small>점</small></p>
        <p id="over-rival" class="rival-line" hidden></p>
        <p id="over-new" class="new-best"><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg> 최고 기록 경신</p>
        <dl class="stats">
          <div><dt>길이</dt><dd id="over-len">4</dd></div>
          <div><dt>먹은 구슬</dt><dd id="over-eaten">0</dd></div>
          <div><dt id="over-t3">시간</dt><dd id="over-time">0:00</dd></div>
        </dl>
        <div id="over-records" class="chips"></div>
        <div id="over-medals" class="new-medals"></div>
      </div>
      <div class="o-right">
        <div class="coin-earn">
          <span class="ce-head"><i class="cn" aria-hidden="true"></i>얻은 코인</span>
          <b id="over-coins">+0</b>
          <span id="over-coin-parts" class="ce-parts"></span>
        </div>
        <div id="over-missions" class="mcard"></div>
        <div class="o-btns">
          <button id="btn-retry" class="big-btn"><svg class="i" aria-hidden="true"><use href="#i-again"/></svg><span>다시 하기</span> <kbd class="only-pc">Enter</kbd></button>
          <div class="o-sub">
            <button id="btn-home" type="button" class="mini-btn">처음 화면</button>
            <button id="btn-hub2" type="button" class="mini-btn" aria-label="게임 고르기로"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>게임 고르기</span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="../common/hub.js"></script>
  <script src="../common/worlds.js"></script>
  <script src="../common/sound.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/space.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
