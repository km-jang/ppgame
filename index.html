<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <title>게임 고르기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700&display=swap">
  <style>
    :root { --ink: #070b16; --display: "Jua", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 24px 16px; color: #fff; font-family: "Noto Sans KR", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 30%, #1b2a55, var(--ink) 70%);
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    h1 { margin: 0; font: normal 40px var(--display); letter-spacing: 2px; transform: skewX(-8deg); text-shadow: 0 4px 0 #0b1222, 0 0 24px rgba(57, 216, 255, .45); }
    .pick { display: grid; grid-template-columns: repeat(2, min(44vw, 380px)); gap: 20px; justify-content: center; }
    @media (max-width: 640px) { .pick { grid-template-columns: min(86vw, 360px); } }
    a {
      position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; overflow: hidden;
      width: 100%; height: clamp(150px, 30vh, 220px); padding: 20px 24px; border-radius: 22px; text-decoration: none; color: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .12s cubic-bezier(.16, 1, .3, 1);
      animation: rise .5s cubic-bezier(.16, 1, .3, 1) both;
    }
    a:nth-child(2) { animation-delay: .08s; }
    a:nth-child(3) { animation-delay: .16s; }
    a:nth-child(4) { animation-delay: .24s; }
    a:active { transform: scale(.97); }
    /* 제목은 한 줄 (글꼴이 늦게 와서 넓은 기본 서체로 보여도 안 넘치게 크기를 칸 너비에 맞춘다), 설명은 두 줄까지 낱말 단위로 */
    a b { font: normal clamp(26px, 3.3vw, 40px) var(--display); line-height: 1.05; white-space: nowrap; transform: skewX(-8deg); transform-origin: left; }
    a small { font-weight: 700; font-size: 16px; line-height: 1.35; opacity: .88; word-break: keep-all; }
    a::before { content: ""; position: absolute; inset: 0; opacity: .9; pointer-events: none; }
    a::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .35) 48%, transparent 58%) no-repeat;
      background-size: 260% 100%; background-position: 160% 0; animation: sweep 4s 1s ease-in-out infinite;
    }
    a > * { position: relative; }
    .kid { background: linear-gradient(150deg, #ffb04a, #ff6a1a 55%, #b8340a); border: 3px solid #ffcf8a; }
    .kid::before { background: repeating-linear-gradient(-45deg, rgba(0, 0, 0, .08) 0 18px, transparent 18px 36px); }
    .kid b { text-shadow: 0 4px 0 rgba(90, 20, 0, .6); }
    .gun { background: linear-gradient(150deg, #0e1a2e, #07080d); border: 3px solid #5ee7ff; color: #5ee7ff; }
    .gun::before { background: linear-gradient(rgba(94, 231, 255, .1) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(94, 231, 255, .1) 1px, transparent 1px) 0 0 / 24px 24px; }
    .gun b { text-shadow: 0 0 18px rgba(94, 231, 255, .8); }
    .snake { background: linear-gradient(150deg, #1a0e2e, #07080d); border: 3px solid #ff2e88; color: #ff9fcb; }
    .snake::before { background: radial-gradient(circle at 78% 28%, rgba(255, 46, 136, .35), transparent 45%), linear-gradient(rgba(255, 46, 136, .09) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(255, 46, 136, .09) 1px, transparent 1px) 0 0 / 24px 24px; }
    .snake b { text-shadow: 0 0 18px rgba(255, 46, 136, .8); }
    .jump { background: linear-gradient(150deg, #0f2a1a, #07080d); border: 3px solid #7dff6a; color: #b8ffae; }
    .jump::before { background: radial-gradient(circle at 80% 25%, rgba(125, 255, 106, .3), transparent 45%), repeating-linear-gradient(0deg, transparent 0 34px, rgba(125, 255, 106, .12) 34px 38px); }
    .jump b { text-shadow: 0 0 18px rgba(125, 255, 106, .8); }
    .runner { background: linear-gradient(150deg, #2a1030, #07080d); border: 3px solid #ffb13d; color: #ffd08a; }
    .runner::before { background: radial-gradient(circle at 50% 20%, rgba(255, 120, 60, .4), transparent 40%), linear-gradient(rgba(255, 177, 61, .1) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(255, 177, 61, .1) 1px, transparent 1px) 0 0 / 28px 28px; }
    .runner b { text-shadow: 0 0 18px rgba(255, 150, 60, .85); }
    .tag { position: absolute; top: 16px; left: 20px; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(0, 0, 0, .3); }
    /* ─── 놀이 본부: 별코인 · 오늘의 미션 · 기록실 (common/hub.js) ─── */
    .hub { width: min(92vw, calc(2 * min(44vw, 380px) + 20px)); display: flex; flex-direction: column; gap: 10px; }
    .hub-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hub-top h1 { flex: 1; }
    .coin-pill, .rec-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; font: normal 20px var(--display); color: #ffe66d; background: rgba(12, 16, 26, .7); border: 2px solid rgba(255, 230, 109, .45); }
    .rec-btn { color: #bff8ff; border-color: rgba(94, 231, 255, .45); cursor: pointer; }
    .rec-btn:active { transform: scale(.96); }
    /* 소리 단추: 네 게임 모두 함께 켜고 끈다 (common/sound.js, 키 play.sound1) */
    .snd-btn { width: 44px; padding: 0; justify-content: center; flex: none; }
    .snd-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .snd-btn .x { display: none; }
    .snd-btn.off { color: #8a93a8; border-color: rgba(138, 147, 168, .45); }
    .snd-btn.off .x { display: inline; } .snd-btn.off .w { display: none; }
    .cn { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff 0 12%, #ffe66d 14% 55%, #c98f00 100%); box-shadow: 0 0 10px rgba(255, 230, 109, .6); }
    .daily { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .dm { position: relative; min-height: 64px; padding: 8px 12px 10px; border-radius: 14px; background: rgba(12, 16, 26, .72); border: 1px solid rgba(94, 231, 255, .25); display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .dm .t { font: normal 17px/1.25 var(--display); word-break: keep-all; }
    .dm .g { display: block; font: normal 14px var(--display); letter-spacing: .5px; opacity: .85; }
    .dm .bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
    .dm .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #5ee7ff, #7dff6a); }
    .dm .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font: normal 15px var(--display); opacity: .95; }
    .dm button { font: normal 17px var(--display); padding: 6px 14px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #fff3a8, #ffcf3a); color: #3a2600; cursor: pointer; box-shadow: 0 3px 0 #9a6b00; animation: nudge 1s ease-in-out infinite; }
    .dm.claimed { opacity: .55; }
    .dm button.wait { animation: none; filter: saturate(.6); }
    .dm.done { border-color: rgba(255, 230, 109, .7); }
    .daily-head { display: flex; justify-content: space-between; font: normal 16px var(--display); color: #bff8ff; letter-spacing: 1px; }
    .daily-head small { font: 700 12px "Noto Sans KR", sans-serif; color: #ffe66d; }
    @keyframes nudge { 50% { transform: scale(1.07); } }
    #records { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 7, 14, .78); }
    #records.on { display: flex; }
    #records .panel { width: min(94vw, 680px); max-height: 92vh; overflow-y: auto; padding: 22px 24px; border-radius: 20px; background: linear-gradient(180deg, rgba(16, 22, 36, .98), rgba(8, 11, 19, .98)); border: 1px solid rgba(94, 231, 255, .3); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
    #records h2 { margin: 0 0 12px; font: normal 30px var(--display); letter-spacing: 1px; }
    .tot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .tot div { padding: 8px 6px; border-radius: 12px; background: rgba(94, 231, 255, .06); border: 1px solid rgba(94, 231, 255, .2); text-align: center; }
    .tot dt { font-size: 12px; opacity: .75; } .tot dd { margin: 2px 0 0; font: normal 22px var(--display); color: #ffe66d; }
    .grow { display: grid; grid-template-columns: 1.3fr 1.2fr .8fr .7fr; gap: 8px; align-items: center; padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: rgba(255, 255, 255, .04); border-left: 5px solid var(--c); font-size: 14px; }
    .grow b { font: normal 19px var(--display); color: var(--c); }
    .grow span { opacity: .9; }
    #rec-close { display: block; width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 14px; font: normal 22px var(--display); background: linear-gradient(180deg, #a8f6ff, #22b8d6); color: #07080d; cursor: pointer; }
    @media (max-height: 600px) {
      body { gap: 12px; padding: 12px 16px; justify-content: flex-start; }
      h1 { font-size: 30px; }
      .dm { min-height: 54px; padding: 6px 10px 8px; gap: 4px; }
      .dm .t { font-size: 16px; } .dm .g { font-size: 13px; } .dm .row { font-size: 14px; }
      .dm button { font-size: 15px; padding: 4px 12px; }
      a { height: clamp(120px, 27vh, 170px); padding: 12px 18px; gap: 4px; }
      a b { font-size: clamp(24px, 3.2vw, 34px); }
      a small { font-size: 15px; }
      .tag { top: 10px; left: 14px; }
    }
    @media (max-width: 640px) { .daily { grid-template-columns: 1fr; } .tot { grid-template-columns: repeat(2, 1fr); } .grow { grid-template-columns: 1fr 1fr; } }
    .stk-btn { position: relative; color: #ffd6e8; border-color: rgba(255, 95, 168, .5); }
    .new-dot { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #ff4d6d; color: #fff; font: 700 13px/22px "Noto Sans KR", sans-serif; box-shadow: 0 0 10px rgba(255, 77, 109, .7); }
    .new-dot[hidden] { display: none; }
    #stickers { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 7, 14, .78); }
    #stickers.on { display: flex; }
    #stickers .panel { width: min(96vw, 1100px); max-height: 94vh; overflow-y: auto; padding: 20px 22px; border-radius: 20px; background: linear-gradient(180deg, rgba(16, 22, 36, .98), rgba(8, 11, 19, .98)); border: 1px solid rgba(255, 95, 168, .35); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
    #stickers h2 { margin: 0 0 10px; font: normal 30px var(--display); letter-spacing: 1px; }
    #stickers h2 small { font-size: 18px; color: #ffe66d; margin-left: 8px; }
    .stk-game { margin: 10px 0 6px; font: normal 18px var(--display); color: var(--c); }
    .stk-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    @media (max-width: 1100px) { .stk-row { grid-template-columns: repeat(4, 1fr); } }
    .stk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px; text-align: center; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); }
    .stk i { font-style: normal; font-size: 34px; line-height: 1.1; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5)); }
    .stk b { font: normal 14px var(--display); }
    .stk small { font-size: 12px; opacity: .75; line-height: 1.25; word-break: keep-all; }
    .stk.got { background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04)); border-color: var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); }
    .stk.locked i { filter: grayscale(1) brightness(.35); }
    .stk.locked b { opacity: .6; }
    .stk.fresh::after { content: "NEW"; position: absolute; top: -6px; right: -4px; padding: 1px 6px; border-radius: 999px; background: #ff4d6d; font: 700 10px "Noto Sans KR", sans-serif; }
    .stk.fresh { animation: pop .6s cubic-bezier(.2, 1.5, .45, 1) both; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .close-btn { display: block; width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 14px; font: normal 22px var(--display); background: linear-gradient(180deg, #ffd6e8, #ff5fa8); color: #2a0718; cursor: pointer; }
    @media (max-width: 760px) { .stk-row { grid-template-columns: repeat(3, 1fr); } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    @keyframes sweep { 0% { background-position: 160% 0; } 30%, 100% { background-position: -70% 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <section class="hub" aria-label="놀이 본부">
    <div class="hub-top">
      <h1>게임 고르기</h1>
      <span class="coin-pill" title="네 게임에서 모은 별코인"><i class="cn" aria-hidden="true"></i><b id="hub-coins">0</b></span>
      <button id="stk-open" class="rec-btn stk-btn" type="button">스티커북<b id="stk-new" class="new-dot" hidden></b></button>
      <button id="rec-open" class="rec-btn" type="button">기록실</button>
      <button id="snd-btn" class="rec-btn snd-btn" type="button" aria-label="소리 끄기" title="소리"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    </div>
    <div class="daily-head"><span>오늘의 미션</span><small id="daily-bonus"></small></div>
    <div id="daily" class="daily"></div>
  </section>
  <div class="pick">
    <a class="gun" data-game="ngun" href="game/index.html"><span class="tag">슈팅</span><b>뿅뿅 우주선</b><small>대포가 하나씩 늘어나는 우주선으로 적을 막아요</small></a>
    <a class="snake" data-game="snake" href="snake/index.html"><span class="tag">뱀</span><b>냠냠 뱀</b><small>화면을 밀어서 구슬을 냠냠, 먹을수록 쭉쭉 길어져요</small></a>
    <a class="jump" data-game="jump" href="jump/index.html"><span class="tag">점프</span><b>통통 점프</b><small>발판을 통통 밟고 하늘 끝까지 올라가요</small></a>
    <a class="runner" data-game="runner" href="runner/index.html"><span class="tag">달리기</span><b>슝슝 우주 달리기</b><small>밀어서 줄을 바꾸고 운석은 피하고 별은 냠</small></a>
  </div>

  <!-- 기록실: 네 게임 기록을 한눈에 -->
  <section id="records" aria-label="기록실">
    <div class="panel">
      <h2>기록실</h2>
      <dl class="tot" id="rec-tot"></dl>
      <div id="rec-rows"></div>
      <button id="rec-close" type="button">닫기</button>
    </div>
  </section>

  <!-- 스티커북: 네 게임에서 특별한 일을 하면 붙는 스티커 -->
  <section id="stickers" class="overlay" aria-label="스티커북">
    <div class="panel">
      <h2>스티커북 <small id="stk-count"></small></h2>
      <div id="stk-list"></div>
      <button id="stk-close" type="button" class="close-btn">닫기</button>
    </div>
  </section>

  <script src="common/hub.js"></script>
  <script src="common/sound.js"></script>
  <script>
    'use strict';
    // 놀이 본부 그리기. 게임에서 돌아올 때마다(renderHub) 새로 읽는다
    (function () {
      const $ = id => document.getElementById(id);
      const fmt = n => Math.floor(n).toLocaleString();
      const name = id => (HUB.GAMES.find(g => g.id === id) || {}).name || '';
      const color = id => (HUB.GAMES.find(g => g.id === id) || {}).color || '#fff';
      // 미션 글 앞에 게임 이름이 또 붙어 있으면 뺀다 (위에 이름표가 따로 있어서). 예전 글 '슝슝 달리기 …'도
      const bare = (id, t) => { const n = name(id); for (const p of [n, n.split(' ')[0] + ' ' + n.split(' ').pop(), n.split(' ')[0]]) if (p && t.startsWith(p + ' ')) return t.slice(p.length + 1); return t; };
      // 받기 버튼이 새로 나타나면 0.5초 동안은 눌러도 안 받는다 (아이들이 화면을 톡톡 두드리다 모르고 받지 않게)
      const CLAIM_WAIT = 500;
      let claimKey = '', claimAt = 0, claimTimer = 0;
      // 카드 주소도 HUB.GAMES에서 (폴더 말고 index.html까지: 파일로 바로 열어도 열리게)
      for (const g of HUB.GAMES) { const a = document.querySelector('.pick a[data-game="' + g.id + '"]'); if (a && g.path) a.setAttribute('href', g.path); }
      // 별코인이 늘면 톡톡 소리와 함께 세어 올린다 (움직임 줄이기면 바로). 처음 그릴 때는 바로
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let shown = -1, coinRaf = 0;
      function showCoins(v) {
        cancelAnimationFrame(coinRaf);
        if (shown < 0 || v <= shown || still) { shown = v; $('hub-coins').textContent = fmt(v); return; }
        const from = shown, t0 = performance.now(), dur = Math.min(900, 250 + (v - from) * 4);
        const step = now => {
          const k = Math.min(1, (now - t0) / dur), n = Math.round(from + (v - from) * (1 - Math.pow(1 - k, 2)));
          if (n !== shown) { shown = n; $('hub-coins').textContent = fmt(n); SND.ui('coin'); }
          if (k < 1) coinRaf = requestAnimationFrame(step);
        };
        coinRaf = requestAnimationFrame(step);
      }
      function renderHub() {
        showCoins(HUB.coins());
        const list = HUB.daily();
        $('daily').innerHTML = list.map((m, i) =>
          '<div class="dm' + (m.claimed ? ' claimed' : m.done ? ' done' : '') + '" style="--c:' + color(m.game) + '">' +
            '<span class="t"><span class="g" style="color:' + color(m.game) + '">' + name(m.game) + '</span>' + bare(m.game, m.text) + '</span>' +
            '<span class="bar"><i style="width:' + Math.round(Math.min(1, m.prog / m.goal) * 100) + '%"></i></span>' +
            '<span class="row"><span>' + fmt(m.prog) + ' / ' + fmt(m.goal) + '</span>' +
            (m.claimed ? '<span>받음</span>' : m.done ? '<button type="button" class="wait" data-claim="' + i + '">+' + m.reward + ' 받기</button>' : '<span>+' + m.reward + '</span>') +
            '</span></div>').join('');
        const key = list.map((m, i) => m.done && !m.claimed ? i : '').join('');
        if (key !== claimKey) { claimKey = key; claimAt = performance.now() + CLAIM_WAIT; }
        clearTimeout(claimTimer);
        const wait = claimAt - performance.now();
        const ready = () => document.querySelectorAll('#daily button.wait').forEach(b => b.classList.remove('wait'));
        if (wait > 0) claimTimer = setTimeout(ready, wait); else ready();
        const left = list.filter(m => !m.claimed).length;
        $('daily-bonus').textContent = left ? '셋 다 받으면 보너스 +' + HUB.DAILY_BONUS : '오늘 미션 끝! 내일 또 만나요';
      }
      function renderRecords() {
        const s = HUB.summary();
        const mins = Math.round(s.todaySec / 60);
        $('rec-tot').innerHTML = [['별코인', fmt(s.coins)], ['모은 메달', s.medals + ' / ' + s.medalMax], ['모두 한 판', fmt(s.games)], ['오늘 논 시간', mins + '분']]
          .map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>').join('');
        $('rec-rows').innerHTML = s.rows.map(r =>
          '<div class="grow" style="--c:' + r.color + '"><b>' + r.name + '</b><span>' + (r.bestText || '아직 기록 없음') + '</span>' +
          '<span>메달 ' + r.medals + (r.medalMax ? ' / ' + r.medalMax : '') + '</span><span>' + fmt(r.games) + '판</span></div>').join('');
      }
      $('daily').addEventListener('click', e => {
        const b = e.target.closest('[data-claim]');
        if (!b || performance.now() < claimAt) return;
        HUB.claimDaily(Number(b.dataset.claim));
        SND.ui('claim');
        renderHub();
      });
      function renderStickers() {
        const list = HUB.stickers(), got = list.filter(t => t.got).length;
        $('stk-count').textContent = got + ' / ' + list.length;
        $('stk-list').innerHTML = HUB.GAMES.map(g => '<p class="stk-game" style="--c:' + g.color + '">' + g.name + '</p><div class="stk-row">' +
          list.filter(t => t.game === g.id).map(t =>
            '<div class="stk ' + (t.got ? 'got' : 'locked') + (t.fresh ? ' fresh' : '') + '" style="--c:' + g.color + '">' +
              '<i aria-hidden="true">' + t.icon + '</i><b>' + (t.got ? t.name : '?') + '</b><small>' + t.desc + '</small></div>').join('') + '</div>').join('');
      }
      function renderNew() {
        const n = HUB.stickers().filter(t => t.fresh).length;
        $('stk-new').hidden = !n;
        $('stk-new').textContent = n;
      }
      const shut = id => { if ($(id).classList.contains('on')) { $(id).classList.remove('on'); SND.ui('close'); } };
      // 새 스티커가 있으면 여는 소리 대신 스티커 소리
      $('stk-open').addEventListener('click', () => { const fresh = HUB.stickers().some(t => t.fresh); renderStickers(); $('stickers').classList.add('on'); SND.ui(fresh ? 'sticker' : 'open'); HUB.seeStickers(); renderNew(); });
      $('stk-close').addEventListener('click', () => shut('stickers'));
      $('stickers').addEventListener('click', e => { if (e.target.id === 'stickers') shut('stickers'); });
      $('rec-open').addEventListener('click', () => { renderRecords(); $('records').classList.add('on'); SND.ui('open'); });
      $('rec-close').addEventListener('click', () => shut('records'));
      $('records').addEventListener('click', e => { if (e.target.id === 'records') shut('records'); });
      // 소리 단추: 네 게임 모두 함께 (다른 탭·게임에서 바꿔도 SND.onChange로 따라 바뀐다)
      const sndIcon = () => { const off = SND.muted(); $('snd-btn').classList.toggle('off', off); $('snd-btn').setAttribute('aria-label', off ? '소리 켜기' : '소리 끄기'); $('snd-btn').setAttribute('aria-pressed', String(off)); };
      $('snd-btn').addEventListener('click', () => { SND.toggleMuted(); SND.ui('tap'); });
      SND.onChange(sndIcon); sndIcon();
      // 게임 카드: 톡 소리를 낸 뒤 0.1초 안에 넘어간다 (소리가 꺼져 있으면 바로)
      let going = false;
      document.querySelector('.pick').addEventListener('click', e => {
        const a = e.target.closest('a[href]');
        if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        if (going) return;
        going = true;
        const go = () => { location.href = a.href; };
        if (SND.ui('tap')) setTimeout(go, 110); else go();
      });
      // 뒤로 가기로 돌아오면 다시 누를 수 있게
      window.addEventListener('pageshow', () => { going = false; });
      const renderHubBase = renderHub;
      renderHub = function () {
        renderHubBase(); renderNew();
        if ($('records').classList.contains('on')) renderRecords();
        if ($('stickers').classList.contains('on')) renderStickers();
      };
      // 게임에서 뒤로 돌아왔을 때(뒤로 가기 저장본에서 살아난 화면 포함)와 다른 앱·탭에서 다시 보일 때: 저장소에서 지갑을 새로 읽어 다시 그린다
      window.addEventListener('pageshow', () => renderHub());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderHub(); });
      window.addEventListener('focus', () => renderHub());
      window.addEventListener('storage', e => { if (!e.key || e.key === HUB.KEY) renderHub(); });
      window.renderHub = () => renderHub();
      renderHub();
    })();
  </script>
</body>
</html>
