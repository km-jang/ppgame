<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="총열이 N개로 늘어나는 총으로 웨이브를 버티는 아레나 슈팅 게임">
  <title>N-GUN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>

  <div id="topbar">
    <button id="btn-pause" class="icon-btn" aria-label="일시정지">⏸</button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
  </div>
  <button id="btn-dash" aria-label="대시">대시</button>
  <div id="toast" role="status"></div>

  <!-- 시작 화면 -->
  <section id="scr-title" class="screen">
    <div class="panel">
      <h1 class="logo">N<span>-</span>GUN</h1>
      <p class="tagline">총열을 늘려라. 끝까지 버텨라.</p>
      <p id="best" class="best"></p>
      <button id="btn-start" class="big-btn">시작 <kbd class="only-pc">Enter</kbd></button>
      <div class="help">
        <div class="help-col only-pc">
          <b>PC</b>
          <span><kbd>WASD</kbd> 이동</span>
          <span>마우스 조준 · 사격은 자동</span>
          <span><kbd>Space</kbd> 대시 (잠깐 무적)</span>
          <span><kbd>F</kbd> 자동 조준 전환 · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</span>
        </div>
        <div class="help-col only-touch">
          <b>모바일</b>
          <span>왼쪽 드래그 이동</span>
          <span>오른쪽 드래그 조준 (떼면 자동 조준)</span>
          <span>오른쪽 아래 버튼 대시</span>
        </div>
      </div>
      <p class="hint">웨이브를 넘길 때마다 카드 1장을 골라 총을 키웁니다. 5웨이브마다 보스.</p>
    </div>
  </section>

  <!-- 카드 선택 -->
  <section id="scr-cards" class="screen">
    <div class="panel wide">
      <h2 id="cards-title">WAVE 1 클리어</h2>
      <p class="sub">강화 카드 1장을 고르세요</p>
      <div id="card-list"></div>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="scr-pause" class="screen">
    <div class="panel">
      <h2>일시정지</h2>
      <p class="sub">조준 방식: <b id="pause-aim">자동</b> <span class="only-pc">(<kbd>F</kbd>로 전환)</span></p>
      <button id="btn-resume" class="big-btn">계속하기</button>
      <button id="btn-quit" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <!-- 게임 오버 -->
  <section id="scr-over" class="screen">
    <div class="panel">
      <h2>격추됨</h2>
      <p class="score-big"><span id="over-score">0</span><small>점</small></p>
      <p id="over-new" class="new-best">🏆 최고 기록 경신</p>
      <dl class="stats">
        <div><dt>웨이브</dt><dd id="over-wave">1</dd></div>
        <div><dt>처치</dt><dd id="over-kills">0</dd></div>
        <div><dt>생존</dt><dd id="over-time">0:00</dd></div>
        <div><dt>총열 N</dt><dd id="over-n">1</dd></div>
      </dl>
      <div id="over-picks" class="picks"></div>
      <button id="btn-retry" class="big-btn">다시 하기 <kbd class="only-pc">Enter</kbd></button>
      <button id="btn-home" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
