<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="총열이 N개로 늘어나는 총으로 웨이브를 버티는 아레나 슈팅 게임">
  <title>N-GUN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="게임 화면"></canvas>

  <div id="topbar">
    <button id="btn-pause" class="icon-btn" aria-label="일시정지">⏸</button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
    <button id="btn-fs" class="icon-btn" aria-label="전체 화면">⛶</button>
  </div>
  <button id="btn-dash" aria-label="대시">대시</button>
  <div id="toast" role="status"></div>

  <!-- 시작 화면 -->
  <section id="scr-title" class="screen">
    <div class="panel">
      <h1 class="logo">N<span>-</span>GUN</h1>
      <p class="tagline">총열을 늘려라. 끝까지 버텨라.</p>
      <p id="best" class="best"></p>
      <div class="settings">
        <div class="seg" role="group" aria-label="난이도">
          <button type="button" data-diff="easy" aria-pressed="false"><b>쉬움</b><small>체력 8 · 적 약함</small></button>
          <button type="button" data-diff="normal" aria-pressed="true"><b>보통</b><small>체력 5</small></button>
          <button type="button" data-diff="hard" aria-pressed="false"><b>어려움</b><small>체력 4 · 점수 ×1.6</small></button>
        </div>
        <div class="toggles">
          <button type="button" class="toggle" data-audio="music" aria-pressed="true">♪ 음악 <span class="state">켬</span></button>
          <button type="button" class="toggle" data-audio="sfx" aria-pressed="true">💥 효과음 <span class="state">켬</span></button>
        </div>
      </div>
      <button id="btn-start" class="big-btn">시작 <kbd class="only-pc">Enter</kbd></button>
      <ul class="help">
        <li><b>왼쪽</b> 드래그로 이동</li>
        <li><b>오른쪽</b> 드래그로 조준 · 떼면 자동 조준</li>
        <li><b>대시</b> 버튼으로 잠깐 무적 돌진</li>
      </ul>
      <p class="pc-line only-pc">PC: <kbd>WASD</kbd> 이동 · 마우스 조준 · <kbd>Space</kbd> 대시 · <kbd>P</kbd> 일시정지</p>
      <p class="hint">웨이브를 넘길 때마다 카드 1장을 골라 총을 키웁니다. 5웨이브마다 보스.</p>
    </div>
  </section>

  <!-- 카드 선택 -->
  <section id="scr-cards" class="screen">
    <div class="panel wide">
      <h2 id="cards-title">WAVE 1 클리어</h2>
      <p class="sub">강화 카드 1장을 고르세요</p>
      <div id="card-list"></div>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="scr-pause" class="screen">
    <div class="panel">
      <h2>일시정지</h2>
      <p class="sub">조준 방식: <b id="pause-aim">자동</b> <span class="only-pc">(<kbd>F</kbd>로 전환)</span></p>
      <div class="toggles">
        <button type="button" class="toggle" data-audio="music" aria-pressed="true">♪ 음악 <span class="state">켬</span></button>
        <button type="button" class="toggle" data-audio="sfx" aria-pressed="true">💥 효과음 <span class="state">켬</span></button>
      </div>
      <button id="btn-resume" class="big-btn">계속하기</button>
      <button id="btn-quit" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <!-- 게임 오버 -->
  <section id="scr-over" class="screen">
    <div class="panel">
      <h2>격추됨</h2>
      <p class="score-big"><span id="over-score">0</span><small>점</small></p>
      <p id="over-new" class="new-best">🏆 최고 기록 경신</p>
      <p class="over-diff">난이도 <b id="over-diff">보통</b></p>
      <dl class="stats">
        <div><dt>웨이브</dt><dd id="over-wave">1</dd></div>
        <div><dt>처치</dt><dd id="over-kills">0</dd></div>
        <div><dt>생존</dt><dd id="over-time">0:00</dd></div>
        <div><dt>총열 N</dt><dd id="over-n">1</dd></div>
      </dl>
      <div id="over-picks" class="picks"></div>
      <button id="btn-retry" class="big-btn">다시 하기 <kbd class="only-pc">Enter</kbd></button>
      <button id="btn-home" class="text-btn">처음 화면으로</button>
    </div>
  </section>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
