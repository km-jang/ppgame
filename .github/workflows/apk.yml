# 뿅뿅 놀이터 안드로이드 앱(APK) 만들기
# 웹 게임 파일을 앱 안에 복사해 넣고 APK를 만든다. 설명: android/README.md
# 2026-09-29 소유자 결정: APK는 당분간 만들지 않는다. 자동 빌드를 끄고 손으로만 돌린다.
# 필요하면 GitHub → Actions → "APK 만들기" → Run workflow (main이면 Releases의 apk-latest 에 올린다).
name: APK 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 웹 게임 파일을 앱 안에 복사
        run: |
          set -euo pipefail
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW"
          cp index.html "$WWW/"
          for d in common game snake jump runner; do
            rsync -a --exclude='*.md' --exclude='.DS_Store' "$d" "$WWW/"
          done
          echo "복사한 파일 수: $(find "$WWW" -type f | wc -l)"
          test -f "$WWW/index.html"
          test -f "$WWW/game/index.html"

      - name: 서명 열쇠 준비
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64}" ] && [ -n "${KS_PASS}" ]; then
            printf '%s' "${KS_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "서명 열쇠를 찾았습니다. 늘 같은 서명으로 만듭니다."
          else
            echo "::warning title=서명 열쇠 없음::ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS 비밀값이 없어 임시(디버그) 열쇠로 서명합니다. 이 APK는 다음 APK로 덮어 설치가 안 될 수 있습니다 (지우고 다시 설치해야 하고 기록도 지워짐). android/README.md 의 비밀값 등록을 해 주세요."
          fi

      - name: APK 만들기
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK 이름 바꾸기와 서명 확인
        run: |
          set -euo pipefail
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p out
          cp "$SRC" out/ppyong-noriteo.apk
          ls -la out
          APKSIGNER=$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)apksigner
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs out/ppyong-noriteo.apk | grep -i "SHA-256" || true
            "$APKSIGNER" verify out/ppyong-noriteo.apk
          else
            echo "apksigner를 찾지 못해 서명 확인은 건너뜁니다"
          fi

      - name: 실행 결과에 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ppyong-noriteo-apk
          path: out/ppyong-noriteo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Releases(apk-latest)에 올리기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          아이 태블릿(갤럭시탭)에 까는 뿅뿅 놀이터 앱입니다. 빌드 ${GITHUB_RUN_NUMBER}, 코드 ${GITHUB_SHA::7}

          설치 방법
          1. 태블릿에서 이 페이지를 열고 아래 Assets 의 ppyong-noriteo.apk 를 누릅니다.
          2. 내려받기가 끝나면 알림이나 내 파일 → 다운로드 에서 ppyong-noriteo.apk 를 누릅니다.
          3. "출처를 알 수 없는 앱" 안내가 나오면 설정 을 누르고 이 출처 허용 을 켠 뒤 뒤로 갑니다.
          4. 설치 를 누릅니다. 홈 화면에 뿅뿅 놀이터 아이콘이 생깁니다.

          새 버전으로 바꿀 때는 같은 방법으로 새 APK를 깔면 됩니다. 지우지 않고 덮어 깔면 기록이 그대로 남습니다.
          자세한 설명: android/README.md
          EOF
          TITLE="뿅뿅 놀이터 APK (최신)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest out/ppyong-noriteo.apk --clobber
            gh release edit apk-latest --title "$TITLE" --notes-file notes.md --prerelease=false
          else
            gh release create apk-latest out/ppyong-noriteo.apk --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
          fi
